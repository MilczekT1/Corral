# Freeze store: only NEW violations fail the build. The store below is committed.
#
# allowStoreCreation is deliberately NOT set here. ArchUnit defaults it to false, and that default
# is the only thing separating "the store is missing" from "silently freeze everything and pass".
# With it pinned to true, a store that never got committed, got gitignored, was lost to a shallow
# checkout, or simply is not where the JVM's working directory says it is produces a GREEN build
# with every violation re-frozen and no signal at all — the exact invisible regression freezing
# exists to prevent.
#
# Seed the store once, out of band, then commit it:
#   mvn test -Darchunit.freeze.store.default.allowStoreCreation=true
#
# Keeps stored.rules complete while writing no file for a rule with zero violations, so this
# committed store carries no empty files. The index entry is what keeps a rule frozen — see
# EmptyOmittingViolationStore.
freeze.store=io.github.milczekt1.llamaguard.store.EmptyOmittingViolationStore

# The path is resolved against the JVM's working directory, not the classpath.
freeze.store.default.path=src/test/resources/archunit/frozen

# Activates WHY / HOW TO FIX / anti-fix policy on failure. This is a GLOBAL per-run setting;
# the formatter falls back to ArchUnit's standard output for your own non-framework rules.
failureDisplayFormat=io.github.milczekt1.llamaguard.format.AgentFriendlyFailureDisplayFormat
