version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  - package-ecosystem: maven
    # Multi-module reactors are handled from the root pom.
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    labels:
      - dependencies
