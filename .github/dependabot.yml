version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  - package-ecosystem: maven
    # Multi-module reactors are handled from the root pom.
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    labels:
      - dependencies
    ignore:
      # Under Maven 3.10, central-publishing-maven-plugin 0.11.0 bundles maven-metadata-local.xml and
      # _remote.repositories, and Central rejects the release. Lift once a fixed plugin ships.
      - dependency-name: "org.apache.maven:apache-maven"
        versions: ["[3.10,)"]
