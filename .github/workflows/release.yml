name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version, e.g. 0.1.0 (no -SNAPSHOT)'
        required: true
      nextVersion:
        description: 'Next development version, e.g. 0.1.1 (no -SNAPSHOT; workflow appends it)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  MVN_CONFIG: -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
  RELEASE_VERSION: ${{ inputs.releaseVersion }}
  NEXT_VERSION: ${{ inputs.nextVersion }}
  RELEASE_BRANCH: release/v${{ inputs.releaseVersion }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Authorize triggerer
        env:
          # Space-separated GitHub usernames allowed to run a release. Edit via PR.
          RELEASE_ALLOWED_ACTORS: "MilczekT1"
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          for allowed in $RELEASE_ALLOWED_ACTORS; do
            if [[ "$allowed" == "$TRIGGER_ACTOR" ]]; then
              echo "$TRIGGER_ACTOR is authorized to release."
              exit 0
            fi
          done
          echo "::error::$TRIGGER_ACTOR is not authorized to trigger a release. Allowed: $RELEASE_ALLOWED_ACTORS" >&2
          exit 1

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Validate inputs and preconditions
        run: |
          for v in "$RELEASE_VERSION" "$NEXT_VERSION"; do
            if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version format: $v" >&2
              exit 1
            fi
          done
          if git rev-parse --verify --quiet "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "Branch $RELEASE_BRANCH already exists on origin" >&2
            exit 1
          fi

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: git checkout -b "$RELEASE_BRANCH"

      - name: Set release version
        run: ./mvnw versions:set -DnewVersion="$RELEASE_VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false ${{ env.MVN_CONFIG }}

      - name: Commit and tag release
        env:
          TRIGGER_ACTOR: ${{ github.actor }}
          TRIGGER_ACTOR_ID: ${{ github.actor_id }}
        run: |
          git commit -a -m "Release Corral $RELEASE_VERSION" \
            -m "Co-authored-by: ${TRIGGER_ACTOR} <${TRIGGER_ACTOR_ID}+${TRIGGER_ACTOR}@users.noreply.github.com>"
          git tag "v$RELEASE_VERSION"

      - name: Check if version already published
        id: check_deployed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils

          all_exist=true
          mapfile -t poms < <(find . -name pom.xml -not -path '*/target/*')
          for pom in "${poms[@]}"; do
            packaging=$(xmllint --xpath "string(/*[local-name()='project']/*[local-name()='packaging'])" "$pom" 2>/dev/null)
            packaging=${packaging:-jar}
            [[ "$packaging" == "pom" ]] && continue

            # Skip modules that are never deployed (maven-deploy-plugin skip=true), or they
            # keep all_exist false forever and the short-circuit below never fires.
            deploy_skip=$(xmllint --xpath "string(//*[local-name()='plugin'][*[local-name()='artifactId']='maven-deploy-plugin']/*[local-name()='configuration']/*[local-name()='skip'])" "$pom" 2>/dev/null)
            [[ "$deploy_skip" == "true" ]] && continue

            groupId=$(xmllint --xpath "string(/*[local-name()='project']/*[local-name()='groupId'])" "$pom" 2>/dev/null)
            if [[ -z "$groupId" ]]; then
              groupId=$(xmllint --xpath "string(/*[local-name()='project']/*[local-name()='parent']/*[local-name()='groupId'])" "$pom" 2>/dev/null)
            fi
            artifactId=$(xmllint --xpath "string(/*[local-name()='project']/*[local-name()='artifactId'])" "$pom" 2>/dev/null)
            groupPath=${groupId//./\/}

            url="https://maven.pkg.github.com/${{ github.repository }}/${groupPath}/${artifactId}/maven-metadata.xml"
            status=$(curl -s -o /tmp/metadata.xml -w '%{http_code}' -u "x-access-token:${GITHUB_TOKEN}" "$url" 2>/dev/null)

            if [[ "$status" == "200" ]] && grep -q "<version>$RELEASE_VERSION</version>" /tmp/metadata.xml 2>/dev/null; then
              echo "$artifactId:$RELEASE_VERSION already published"
            else
              echo "$artifactId:$RELEASE_VERSION not yet published"
              all_exist=false
            fi
          done
          echo "skip=$all_exist" >> "$GITHUB_OUTPUT"

      - name: Verify release tree before publishing
        if: steps.check_deployed.outputs.skip != 'true'
        run: ./mvnw clean verify ${{ env.MVN_CONFIG }}

      - name: Deploy to GitHub Packages
        if: steps.check_deployed.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./mvnw deploy -DskipTests=true ${{ env.MVN_CONFIG }}

      - name: Set next development version
        run: ./mvnw versions:set -DnewVersion="$NEXT_VERSION-SNAPSHOT" -DprocessAllModules=true -DgenerateBackupPoms=false ${{ env.MVN_CONFIG }}

      - name: Commit next development version
        run: git commit -a -m "Prepare next release Corral $NEXT_VERSION-SNAPSHOT"

      - name: Push release branch and tag
        run: git push --atomic origin "$RELEASE_BRANCH" "v$RELEASE_VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$RELEASE_VERSION" --title "v$RELEASE_VERSION" --generate-notes

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "Release Corral $RELEASE_VERSION" \
            --body "Automated release PR for \`v$RELEASE_VERSION\`. Triggered by @${TRIGGER_ACTOR}." \
            --assignee "$TRIGGER_ACTOR" || \
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "Release Corral $RELEASE_VERSION" \
            --body "Automated release PR for \`v$RELEASE_VERSION\`. Triggered by @${TRIGGER_ACTOR}."

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: gh pr merge "$RELEASE_BRANCH" --auto --rebase --delete-branch
