name: Scripts test

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/**
      - .claude/hooks/**
      - .github/workflows/scripts-test.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/**
      - .claude/hooks/**
      - .github/workflows/scripts-test.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Do not make this a required check: path filtering leaves it pending on PRs that skip it.
  scripts_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release scripts and Claude Code hooks
        run: node --test .github/scripts/*.test.js .claude/hooks/*.test.js
