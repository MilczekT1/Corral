# MANUAL PUBLISH of main's -SNAPSHOT to Central's snapshot repository, so consumers can try a
# change before a release is cut. Snapshots may be re-deployed as often as needed. Requires
# snapshots to be enabled for the namespace in the Central Portal.
#
# Runs only from main: the maven-central environment holding the publishing secrets allows no
# other ref. Releases, and re-uploads of a release dropped in the Portal, go through
# .github/workflows/release.yml and .github/workflows/publish-release.yml.
name: Publish artifact (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Snapshot version to publish, e.g. 0.1.1-SNAPSHOT. Must match the version committed on main — checked when non-empty.'
        required: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  MVN_CONFIG: -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

jobs:
  build:
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read

    steps:
      - name: Authorize triggerer
        env:
          # Space-separated GitHub usernames allowed to publish by hand. Keep in sync with release.yml and publish-release.yml.
          RELEASE_ALLOWED_ACTORS: "MilczekT1"
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          for allowed in $RELEASE_ALLOWED_ACTORS; do
            if [[ "$allowed" == "$TRIGGER_ACTOR" ]]; then
              echo "$TRIGGER_ACTOR is authorized to publish."
              exit 0
            fi
          done
          echo "::error::$TRIGGER_ACTOR is not authorized to publish. Allowed: $RELEASE_ALLOWED_ACTORS" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
      - name: Assert checked-out version matches input
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$EXPECTED_VERSION" ]]; then
            echo "No version input given; skipping check."
            exit 0
          fi
          actual_version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Checked-out project version ($actual_version) does not match the version input ($EXPECTED_VERSION)." >&2
            exit 1
          fi
          echo "Checked-out project version matches input: $actual_version"
      - name: Verify before publishing
        run: ./mvnw clean verify ${{ env.MVN_CONFIG }}
      - name: Upload to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw deploy -Pcentral -DskipTests=true ${{ env.MVN_CONFIG }}
