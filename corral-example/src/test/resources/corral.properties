# Settings for this project. Corral's own jars never ship this file.
corral.base-package=com.example.consumer

# A rule this codebase permanently opts out of: corral.exclude.<rule-id>=<reason>. The reason is
# mandatory and is printed on every other rule's failure. This is NOT a pause button: an excluded rule
# records nothing, so violations added while it is off resurface as new the day the line is deleted.
corral.exclude.corral.logging.no-system-err=Demonstrating exclusion is this module's job; StderrWriterAllowedByExclusion is the demo.
